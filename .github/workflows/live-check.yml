name: Live check

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/live-check.ts"
      - "scripts/raycast-stub.mjs"
      - ".github/workflows/live-check.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run live-check
        env:
          VAL_TOWN_TOKEN: ${{ secrets.VAL_TOWN_TOKEN }}
